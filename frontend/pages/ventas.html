<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas | ElectroTech</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/ventas.css">
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar-container"></div>
  
  <!-- Main Content -->
  <main style="margin-left: 240px; padding: 20px;">
    <div class="container-fluid">
      <h2 class="mb-4 text-primary fw-bold">Gestión de Ventas</h2>
      <div class="row g-4 justify-content-center">
        <div class="col-12 col-lg-7 d-flex flex-column align-items-center">
          <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalVenta">Registrar nueva venta</button>
        </div>
        <!-- Modal para registrar venta -->
        <div class="modal fade" id="modalVenta" tabindex="-1" aria-labelledby="modalVentaLabel" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content rounded-4 shadow-lg border-0">
              <div class="modal-header text-white rounded-top-4">
                <h5 class="modal-title fw-bold" id="modalVentaLabel">
                  <i class="bi bi-cart-plus me-2"></i> Registrar nueva venta
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body p-4">
                <form id="formVenta">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label">Cliente</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <select name="cliente_id" id="selectCliente" class="form-select" required></select>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Descuento</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-percent"></i></span>
                        <input type="number" name="descuento" class="form-control" min="0" value="0">
                      </div>
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Productos</label>
                      <div id="productosVenta"></div>
                      <button type="button" class="btn btn-outline-success btn-sm mt-2" id="btnAgregarProducto">Agregar producto</button>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Método de pago</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-credit-card"></i></span>
                        <select name="metodo_pago" class="form-select" required>
                          <option value="Efectivo">Efectivo</option>
                          <option value="Tarjeta">Tarjeta</option>
                          <option value="Transferencia">Transferencia</option>
                        </select>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Total</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-cash-coin"></i></span>
                        <input type="text" id="totalVenta" class="form-control" readonly>
                      </div>
                    </div>
                  </div>
                  <div class="mt-4 d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary px-4 fw-bold">Registrar venta</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row mt-4 justify-content-center">
        <div class="col-12 col-lg-10">
          <div class="card mb-4 w-100">
            <div class="card-body">
              <h4 class="mb-3">Historial de ventas</h4>
              <div id="tablaVentas"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/ventas.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
