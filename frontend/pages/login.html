<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ElectroTech</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/electrotech-theme.css">
  <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card card-electrotech p-4 shadow-lg animate-fade-in-up" style="min-width:400px;">
      <div class="text-center mb-4">
        <div class="logo-container mb-2">
          <div class="lightning-bolt animate-pulse">
            <i class="fas fa-bolt fa-3x" style="color: #007bff;"></i>
          </div>
        </div>
        <h3 class="mb-0" style="color: #203A43; font-weight: bold;">ElectroTech</h3>
        <small class="text-muted">Inicie Sesión para continuar</small>
      </div>
      <form id="loginForm">
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input type="text" class="form-control input-electrotech" id="usuario" required>
        </div>
        <div class="mb-3">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input type="password" class="form-control input-electrotech" id="contrasena" required>
        </div>
        <button type="submit" class="btn btn-primary btn-electrotech w-100">
          <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
        </button>
      </form>
      <div id="loginError" class="text-danger mt-2" style="display:none;"></div>
    </div>
  </div>
  <!-- Toast Container -->
        </div>
      </div>
    </div>
  </div>



  <div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050;"></div>
  <script src="../assets/js/login.js"></script>
</body>
</html>
