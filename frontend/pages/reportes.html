<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes | SIS Electrónico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/reportes.css">
</head>
<body>
  <!-- Sidebar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary flex-column vh-100" style="width:220px;position:fixed;">
    <a class="navbar-brand mx-2" href="#">SIS Electrónico</a>
    <ul class="navbar-nav flex-column mt-4">
  <li class="nav-item"><a class="nav-link" href="dashboard.html">Panel de Control</a></li>
  <li class="nav-item"><a class="nav-link" href="productos.html">Inventario</a></li>
  <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
  <li class="nav-item"><a class="nav-link" href="ventas.html">Ventas</a></li>
  <li class="nav-item"><a class="nav-link active" href="reportes.html">Reportes</a></li>
  <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
  <li class="nav-item"><a class="nav-link" href="#">Consulta Rápida</a></li>
  <li class="nav-item"><a class="nav-link" href="login.html">Logout</a></li>
    </ul>
     <!-- Consulta Rápida -->
  </nav>
  <main>
    <div class="container-fluid">
      <h2 class="mb-4">Reportes</h2>
      <div class="row g-4">
  <div class="col-12 mb-3">
          <div class="card shadow-sm border-primary rounded-4">
            <div class="card-body">
              <h5 class="card-title">Reporte de ventas por fecha/rango</h5>
              <form id="formRangoFechas">
                <div class="mb-2">
                  <label class="form-label">Desde</label>
                  <input type="date" name="fecha_inicio" class="form-control" required>
                </div>
                <div class="mb-2">
                  <label class="form-label">Hasta</label>
                  <input type="date" name="fecha_fin" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary btn-sm">Generar</button>
                <button type="button" class="btn btn-outline-success btn-sm ms-2" id="btnExportarVentasPDF">PDF</button>
                <button type="button" class="btn btn-outline-info btn-sm ms-2" id="btnExportarVentasExcel">Excel</button>
              </form>
              <div id="tablaReporteVentas" class="mt-3"></div>
            </div>
          </div>
        </div>
  <div class="col-12 mb-3">
          <div class="card shadow-sm border-success rounded-4">
            <div class="card-body">
              <h5 class="card-title">Productos más vendidos</h5>
              <button type="button" class="btn btn-primary btn-sm" id="btnGenerarProductosVendidos">Generar</button>
              <button type="button" class="btn btn-outline-success btn-sm ms-2" id="btnExportarProductosPDF">PDF</button>
              <button type="button" class="btn btn-outline-info btn-sm ms-2" id="btnExportarProductosExcel">Excel</button>
              <div id="tablaReporteProductos" class="mt-3"></div>
            </div>
          </div>
        </div>
  <div class="col-12 mb-3">
          <div class="card shadow-sm border-warning rounded-4">
            <div class="card-body">
              <h5 class="card-title">Clientes con más compras</h5>
              <button type="button" class="btn btn-primary btn-sm" id="btnGenerarClientesCompras">Generar</button>
              <button type="button" class="btn btn-outline-success btn-sm ms-2" id="btnExportarClientesPDF">PDF</button>
              <button type="button" class="btn btn-outline-info btn-sm ms-2" id="btnExportarClientesExcel">Excel</button>
              <div id="tablaReporteClientes" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11"></div>
    </div>
  </main>
  <script src="../assets/js/reportes.js"></script>
</body>
</html>
