<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | ElectroTech</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/clientes.css">
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar-container"></div>
  
  <!-- Main Content -->
  <main style="margin-left: 240px; padding: 20px;">
    <div class="container-fluid">
      <h2 class="mb-4 text-primary fw-bold">Gestión de Clientes</h2>
      <!-- Botón Agregar Cliente -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCliente">
          <i class="fas fa-user-plus"></i> Agregar Cliente
        </button>
        <div class="input-group" style="max-width: 300px;">
          <input type="text" class="form-control" id="buscarCliente" placeholder="Buscar cliente...">
          <button class="btn btn-outline-secondary" type="button">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </div>
      
      <!-- Lista de Clientes -->
      <div class="row" id="cardsClientes">
        <!-- Los clientes se cargarán aquí dinámicamente -->
      </div>
    </div>
  </main>

  <!-- Modal para Agregar/Editar Cliente -->
  <div class="modal fade" id="modalCliente" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalClienteTitulo">Agregar Cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formCliente">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre Completo</label>
              <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" id="email" name="email">
            </div>
            <div class="mb-3">
              <label for="telefono" class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="telefono" name="telefono">
            </div>
            <div class="mb-3">
              <label for="direccion" class="form-label">Dirección</label>
              <textarea class="form-control" id="direccion" name="direccion" rows="3"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" form="formCliente">Guardar Cliente</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/clientes.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>

  <main class="pt-4" style="margin-left:220px;">
    <div class="container-fluid">
      <h2 class="mb-4">Gestión de Clientes</h2>
      <div class="row g-4">
        <div class="col-lg-12">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h4 class="mb-0">Lista de Clientes</h4>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalCliente">Agregar cliente</button>
          </div>
          <div class="card mb-4">
            <div class="card-body">
              <div class="row" id="cardsClientes"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- Modal para agregar cliente -->
      <div class="modal fade" id="modalCliente" tabindex="-1" aria-labelledby="modalClienteLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
          <div class="modal-content rounded-4 shadow-lg border-0">
            <div class="modal-header text-white rounded-top-4">
              <h5 class="modal-title fw-bold" id="modalClienteLabel">
                <i class="bi bi-person-badge me-2"></i> Cliente
              </h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
              <form id="formCliente">
                <input type="hidden" name="id_cliente" value="">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-person"></i></span>
                      <input type="text" name="nombre" class="form-control" required>
                    </div>
                  </div>
                  <div class="col-md-6">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                      <input type="email" name="email" class="form-control">
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Teléfono</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                      <input type="text" name="telefono" class="form-control">
                    </div>
                  </div>
                  <div class="col-md-12">
                    <label class="form-label">Dirección</label>
                    <textarea name="direccion" class="form-control" rows="2"></textarea>
                  </div>
                </div>
                <div class="mt-4 d-flex justify-content-end gap-2">
                  <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancelar</button>
                  <button type="submit" class="btn btn-primary px-4 fw-bold">Guardar</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../assets/js/clientes.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
