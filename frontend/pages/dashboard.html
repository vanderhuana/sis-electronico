<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | ElectroTech</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/electrotech-theme.css">
  <link rel="stylesheet" href="../assets/css/sidebar.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar-container"></div>
  <!-- Main Content -->
  <main style="margin-left: 240px; padding: 20px;">
    <div class="container-fluid">
      <h2 class="mb-2 text-primary fw-bold fs-4">Panel de Control</h2>
      
      <!-- Statistics Cards -->
      <div class="row g-2">
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card-electrotech stat-card border-0 shadow-lg h-100 position-relative animate-fade-in-up">
            <div class="stat-gradient stat-gradient-primary"></div>
            <div class="card-body position-relative text-center d-flex flex-column justify-content-center py-2">
              <div class="mb-1">
                <div class="stat-icon-centered mx-auto mb-1" style="font-size: 1rem;">
                  <i class="fas fa-chart-line"></i>
                </div>
                <h6 class="card-title text-primary fw-bold mb-1" style="font-size: 0.8rem;">Ventas del Mes</h6>
                <p class="card-text fs-5 fw-bold mb-1" id="ventasMes">-</p>
                <small class="text-muted" style="font-size: 0.7rem;">Ventas realizadas</small>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card stat-card border-0 shadow-lg h-100 position-relative overflow-hidden">
            <div class="stat-gradient stat-gradient-success"></div>
            <div class="card-body position-relative text-center d-flex flex-column justify-content-center py-2">
              <div class="mb-1">
                <div class="stat-icon-centered stat-icon-success mx-auto mb-1" style="font-size: 1rem;">
                  <i class="fas fa-dollar-sign"></i>
                </div>
                <h6 class="card-title text-success fw-bold mb-1" style="font-size: 0.8rem;">Ingresos del Día</h6>
                <p class="card-text fs-5 fw-bold mb-1" id="ingresosDia">-</p>
                <small class="text-muted" style="font-size: 0.7rem;">Ingresos generados</small>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card stat-card border-0 shadow-lg h-100 position-relative overflow-hidden">
            <div class="stat-gradient stat-gradient-warning"></div>
            <div class="card-body position-relative text-center d-flex flex-column justify-content-center py-2">
              <div class="mb-1">
                <div class="stat-icon-centered stat-icon-warning mx-auto mb-1" style="font-size: 1rem;">
                  <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h6 class="card-title text-warning fw-bold mb-1" style="font-size: 0.8rem;">Stock Bajo</h6>
                <p class="card-text fs-5 fw-bold mb-1" id="stockBajo">-</p>
                <small class="text-muted" style="font-size: 0.7rem;">Productos con bajo stock</small>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card stat-card border-0 shadow-lg h-100 position-relative overflow-hidden">
            <div class="stat-gradient stat-gradient-info"></div>
            <div class="card-body position-relative text-center d-flex flex-column justify-content-center py-2">
              <div class="mb-1">
                <div class="stat-icon-centered stat-icon-info mx-auto mb-1" style="font-size: 1rem;">
                  <i class="fas fa-users"></i>
                </div>
                <h6 class="card-title text-info fw-bold mb-1" style="font-size: 0.8rem;">Clientes Registrados</h6>
                <p class="card-text fs-5 fw-bold mb-1" id="clientesRegistrados">-</p>
                <small class="text-muted" style="font-size: 0.7rem;">Total de clientes</small>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Charts -->
      <div class="row mt-2 g-2 justify-content-center">
        <div class="col-md-6">
          <div class="card chart-card border-0 shadow-lg position-relative overflow-hidden" style="height: 500px;">
            <div class="chart-gradient chart-gradient-primary"></div>
            <div class="card-header bg-transparent border-0 position-relative py-2">
              <div class="d-flex justify-content-between align-items-center">
                <h6 class="mb-0 fw-bold text-primary" style="font-size: 0.9rem;">
                  <i class="fas fa-chart-area me-1" style="font-size: 0.8rem;"></i>
                  Ingresos últimos 12 meses
                </h6>
                <div class="chart-icon" style="font-size: 0.8rem;">
                  <i class="fas fa-trending-up"></i>
                </div>
              </div>
            </div>
            <div class="card-body position-relative p-3" style="height: 430px;">
              <canvas id="chartIngresos" style="width: 100%; height: 100%;"></canvas>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card chart-card border-0 shadow-lg position-relative overflow-hidden" style="height: 500px;">
            <div class="chart-gradient chart-gradient-success"></div>
            <div class="card-header bg-transparent border-0 position-relative py-2">
              <div class="d-flex justify-content-between align-items-center">
                <h6 class="mb-0 fw-bold text-success" style="font-size: 0.9rem;">
                  <i class="fas fa-chart-pie me-1" style="font-size: 0.8rem;"></i>
                  Top 5 productos más vendidos
                </h6>
                <div class="chart-icon" style="font-size: 0.8rem;">
                  <i class="fas fa-medal"></i>
                </div>
              </div>
            </div>
            <div class="card-body position-relative p-3" style="height: 430px;">
              <canvas id="chartTopProductos" style="width: 100%; height: 100%;"></canvas>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Toast Container -->
      <div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050;"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/dashboard.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
</html>
