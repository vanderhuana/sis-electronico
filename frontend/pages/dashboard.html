<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | ElectroTech</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar-container"></div>
  
  <!-- Main Content -->
  <main style="margin-left: 240px; padding: 20px;">
    <div class="container-fluid">
      <h2 class="mb-4 text-primary fw-bold">Panel de Control</h2>
      
      <!-- Statistics Cards -->
      <div class="row g-4">
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card shadow-sm border-primary rounded-4">
            <div class="card-body">
              <h5 class="card-title text-primary">Ventas del Mes</h5>
              <p class="card-text fs-4 fw-semibold" id="ventasMes">-</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card shadow-sm border-success rounded-4">
            <div class="card-body">
              <h5 class="card-title text-success">Ingresos del Día</h5>
              <p class="card-text fs-4 fw-semibold" id="ingresosDia">-</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card shadow-sm border-warning rounded-4">
            <div class="card-body">
              <h5 class="card-title text-warning">Stock Bajo</h5>
              <p class="card-text fs-4 fw-semibold" id="stockBajo">-</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card shadow-sm border-info rounded-4">
            <div class="card-body">
              <h5 class="card-title text-info">Clientes Registrados</h5>
              <p class="card-text fs-4 fw-semibold" id="clientesRegistrados">-</p>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Charts -->
      <div class="row mt-4 g-4 justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm border-primary rounded-4">
            <div class="card-header bg-primary text-white rounded-top">
              <h6 class="mb-0">Ingresos últimos 12 meses</h6>
            </div>
            <div class="card-body">
              <canvas id="chartIngresos"></canvas>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card shadow-sm border-success rounded-4">
            <div class="card-header bg-success text-white rounded-top">
              <h6 class="mb-0">Top 5 productos más vendidos</h6>
            </div>
            <div class="card-body">
              <canvas id="chartTopProductos"></canvas>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Toast Container -->
      <div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/dashboard.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
</html>
