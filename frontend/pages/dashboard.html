<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | SIS Electrónico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
  <!-- Sidebar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary flex-column vh-100" style="width:220px;position:fixed;">
    <a class="navbar-brand mx-2" href="#">SIS Electrónico</a>
    <ul class="navbar-nav flex-column mt-2">
      <li class="nav-item"><a class="nav-link" href="dashboard.html">Panel de Control</a></li>
      <li class="nav-item"><a class="nav-link" href="productos.html">Inventario</a></li>
      <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
      <li class="nav-item"><a class="nav-link" href="ventas.html">Ventas</a></li>
      <li class="nav-item"><a class="nav-link" href="reportes.html">Reportes</a></li>
      <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
      <li class="nav-item"><a class="nav-link" href="login.html">Logout</a></li>
    </ul>
  </nav>
  <!-- Main -->
  <main class="ms-5 ps-5 pt-4">
  <div class="container-fluid px-3 px-md-4">
      <h2 class="mb-4 text-primary fw-bold">Panel de Control</h2>
      <div class="row g-4 flex-wrap">
        <div class="col-12 col-sm-6 col-lg-3 mb-3">
          <div class="card shadow-sm border-primary rounded-4">
            <div class="card-body">
              <h5 class="card-title text-primary">Ventas del Mes</h5>
              <p class="card-text fs-4 fw-semibold" id="ventasMes">-</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3 mb-3">
          <div class="card shadow-sm border-success rounded-4">
            <div class="card-body">
              <h5 class="card-title text-success">Ingresos del Día</h5>
              <p class="card-text fs-4 fw-semibold" id="ingresosDia">-</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3 mb-3">
          <div class="card shadow-sm border-warning rounded-4">
            <div class="card-body">
              <h5 class="card-title text-warning">Stock Bajo</h5>
              <p class="card-text fs-4 fw-semibold" id="stockBajo">-</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3 mb-3">
          <div class="card shadow-sm border-info rounded-4">
            <div class="card-body">
              <h5 class="card-title text-info">Clientes Registrados</h5>
              <p class="card-text fs-4 fw-semibold" id="clientesRegistrados">-</p>
            </div>
          </div>
        </div>
      </div>
      </div>
      <div class="row mt-3 g-4 justify-content-center">
  <div class="col-md-4">
          <div class="card shadow-sm border-primary rounded-4">
            <div class="card-header bg-primary text-white rounded-top">Ingresos últimos 12 meses</div>
            <div class="card-body">
              <canvas id="chartIngresos"></canvas>
            </div>
          </div>
        </div>
  <div class="col-md-4">
          <div class="card shadow-sm border-success rounded-4">
            <div class="card-header bg-success text-white rounded-top">Top 5 productos más vendidos</div>
            <div class="card-body">
              <canvas id="chartTopProductos"></canvas>
            </div>
          </div>
        </div>
      </div>
      <div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11"></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>
