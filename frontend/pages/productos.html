</head>
  <body>

    <a class="navbar-brand mx-2" href="#">SIS Electrónico</a>

    </ul>
     <!-- Consulta Rápida -->
  </nav>
  <main class="pt-4" style="margin-left:220px;">
    <div class="container-fluid">
      <h2 class="mb-4">Gestion de Inventarios</h2>
      <div class="row g-4">
        <div class="col-lg-12">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h4 class="mb-0">Productos Disponibles</h4>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalProducto">Agregar producto</button>
          </div>
          <div class="card mb-4">
            <div class="card-body">
              <div class="row" id="cardsProductos"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- Modal para agregar producto -->
      <div class="modal fade" id="modalProducto" tabindex="-1" aria-labelledby="modalProductoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
          <div class="modal-content rounded-4 shadow-lg border-0">
            <div class="modal-header text-white rounded-top-4">
              <h5 class="modal-title fw-bold" id="modalProductoLabel">
                <i class="bi bi-box-seam me-2"></i> Producto
              </h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
              <form id="formProducto">
                <input type="hidden" name="codigo_sku" value="">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-tag"></i></span>
                      <input type="text" name="nombre" class="form-control" required>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Categoría</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-list"></i></span>
                      <input type="text" name="categoria" class="form-control">
                    </div>
                  </div>
                  <div class="col-md-12">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="2"></textarea>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Precio Compra</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                      <input type="number" name="precio_compra" class="form-control" min="0" step="0.01">
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Precio Venta</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                      <input type="number" name="precio_venta" class="form-control" min="0.01" step="0.01" required>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Stock</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-archive"></i></span>
                      <input type="number" name="stock" class="form-control" min="0" required>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Proveedor</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-truck"></i></span>
                      <input type="text" name="proveedor" class="form-control">
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Imagen</label>
                    <input type="file" name="imagen_file" class="form-control" accept="image/*">
                    <input type="hidden" name="imagen_url" class="form-control">
                  </div>
                  <div class="col-md-6 d-flex align-items-end">
                    <img id="previewImagen" src="" alt="" style="max-width:120px;max-height:120px;display:none;margin-top:5px;border-radius:8px;box-shadow:0 0 8px #ccc;">
                  </div>
                </div>
                <div class="mt-4 d-flex justify-content-end gap-2">
                  <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancelar</button>
                  <button type="submit" class="btn btn-primary px-4 fw-bold">Guardar</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      </div>
      <div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11"></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/productos.js"></script>
</body>
</html>
