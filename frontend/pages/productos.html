<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario | ElectroTech</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/productos.css">
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar-container"></div>
  
  <!-- Main Content -->
  <main style="margin-left: 240px; padding: 20px;">
    <div class="container-fluid">
      <h2 class="mb-4 text-primary fw-bold">Gestión de Inventario</h2>
      <!-- Botón Agregar Producto -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalProducto">
          <i class="fas fa-plus"></i> Agregar Producto
        </button>
        <div class="input-group" style="max-width: 300px;">
          <input type="text" class="form-control" id="buscarProducto" placeholder="Buscar producto...">
          <button class="btn btn-outline-secondary" type="button">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </div>
      
      <!-- Lista de Productos -->
      <div class="row" id="cardsProductos">
        <!-- Los productos se cargarán aquí dinámicamente -->
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11"></div>

  <!-- Modal para Agregar/Editar Producto -->
  <div class="modal fade" id="modalProducto" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalProductoTitulo">Agregar Producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formProducto" enctype="multipart/form-data">
            <input type="hidden" name="codigo_sku" id="codigo_sku">
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre del Producto</label>
                  <input type="text" class="form-control" id="nombre" name="nombre" required>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="categoria" class="form-label">Categoría</label>
                  <input type="text" class="form-control" id="categoria" name="categoria">
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="precio_compra" class="form-label">Precio de Compra</label>
                  <input type="number" class="form-control" id="precio_compra" name="precio_compra" step="0.01">
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="precio_venta" class="form-label">Precio de Venta</label>
                  <input type="number" class="form-control" id="precio_venta" name="precio_venta" step="0.01" required>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="stock" class="form-label">Stock</label>
                  <input type="number" class="form-control" id="stock" name="stock" value="0">
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="proveedor" class="form-label">Proveedor</label>
                  <input type="text" class="form-control" id="proveedor" name="proveedor">
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label for="descripcion" class="form-label">Descripción</label>
              <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label for="imagen_file" class="form-label">Imagen del Producto</label>
              <input type="file" class="form-control" id="imagen_file" name="imagen_file" accept="image/*">
              <input type="hidden" name="imagen_url">
              <div class="mt-2">
                <img id="previewImagen" src="" alt="" style="max-width: 150px; max-height: 150px; display: none; border-radius: 8px;">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" form="formProducto">Guardar Producto</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/productos.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
