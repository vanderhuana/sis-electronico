# Configuración de Nginx para ElectroTech Frontend
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index login.html index.html;

    # Configuración para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Configuración para páginas HTML
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Redirección de la raíz a login
    location = / {
        return 301 /pages/login.html;
    }

    # Manejo de errores
    error_page 404 /pages/login.html;
    error_page 500 502 503 504 /pages/login.html;

    # Configuraciones de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}